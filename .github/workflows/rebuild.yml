name: rebuild-patched-hax

# Applies the minimal `extra_tools` patch (in patches/) to the *latest* upstream hax
# release, builds Linux (x86_64) and macOS (arm64) binaries, and publishes them as
# GitHub Release assets. Rebuilds are triggered weekly, on demand, or when the
# patch/workflow change.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'   # weekly Monday 05:30 UTC
  push:
    paths:
      - 'patches/**'
      - '.github/workflows/rebuild.yml'

permissions:
  contents: write   # to create a release and upload the binary assets

jobs:
  # Determine the latest upstream tag and create (if absent) the patched release.
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.up.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: read latest upstream release tag
        id: up
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/OleksandrChekhovskyi/hax/releases/latest | jq -r '.tag_name')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest upstream: $TAG"

      - name: ensure patched release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.up.outputs.tag }}"
          REL_TAG="${TAG}-extra_tools"
          if ! gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release create "$REL_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "hax ${TAG} + extra_tools (server-side web search)" \
              --notes "Patched hax for ${TAG} with the extra_tools server-side web search field. See patches/extra_tools_server_side.patch."
          fi
          echo "release ${REL_TAG} ready"

  build:
    needs: release
    name: build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            deps: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                build-essential meson ninja-build pkg-config \
                libjansson-dev libcurl4-openssl-dev
          - os: macos-14
            artifact: macos-arm64
            deps: |
              brew install meson ninja pkg-config jansson curl

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install build dependencies
        run: ${{ matrix.deps }}

      - name: apply patch to a clean upstream checkout at the latest tag
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          mkdir -p /tmp/src
          git clone --depth 1 --branch "$TAG" \
            https://github.com/OleksandrChekhovskyi/hax.git /tmp/src
          cp "patches/extra_tools_server_side.patch" /tmp/src/
          cd /tmp/src
          git apply --verbose extra_tools_server_side.patch

      - name: build patched hax
        run: |
          cd /tmp/src
          meson setup build
          ninja -C build
          ./build/hax --version

      - name: publish patched binary as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          REL_TAG="${TAG}-extra_tools"
          BIN="hax-${TAG}-extra_tools-${{ matrix.artifact }}"
          cp /tmp/src/build/hax "$BIN"
          gh release upload "$REL_TAG" "$BIN" --repo "$GITHUB_REPOSITORY" --clobber
          echo "published $BIN to release ${REL_TAG}"
